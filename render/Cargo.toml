[package]
name = "wows-replay-render"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Renders World of Warships replays to minimap video with a battle sidebar"
publish = false

[lib]
name = "replay_render"

[[bin]]
name = "wows-render"
path = "src/bin/wows-render.rs"

[dependencies]
wows-replay-parser = { path = ".." }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
